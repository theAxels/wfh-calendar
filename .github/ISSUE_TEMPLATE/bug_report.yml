name: Bug report
description: Report a reproducible problem with calendar generation or subscription feeds.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: feed
    attributes:
      label: Affected feed or URL
      placeholder: all.ics or team-a.ics
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and logs
      description: Remove tokens, secrets, and personal data before posting.
