name: Sync holiday cache

on:
  workflow_dispatch:
    inputs:
      year:
        description: Optional year to sync (must be published by the API)
        required: false
        type: string
      force:
        description: Re-fetch already cached years
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync holiday cache
        id: sync
        run: |
          args=()
          if [ -n "${{ inputs.year }}" ]; then args+=("--year=${{ inputs.year }}"); fi
          if [ "${{ inputs.force }}" = "true" ]; then args+=("--force"); fi
          node scripts/sync-holidays.mjs "${args[@]}"

      - name: Regenerate ICS feeds
        if: ${{ success() }}
        run: node scripts/generate-ics.mjs

      - name: Commit updated holiday data and feeds
        if: ${{ success() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/holidays public/ics public/data
          if ! git diff --cached --quiet; then
            year="${{ inputs.year }}"
            [ -n "$year" ] || year="$(date -u +%Y)"
            git commit -m "chore(holidays): sync $year data"
            git push
          fi

      - name: Commit failure status only
        if: ${{ failure() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/holidays/sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(holidays): record failed sync status"
            git push
          fi

      - name: Ensure failure label exists
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create holiday-sync-failure --color D73A4A --description "Holiday data sync or validation failed" --force

      - name: Report failure to GitHub Issues
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="holiday-sync-failure: $(date -u +%Y-%m-%d)"
          body="The scheduled/manual holiday sync or calendar generation failed. Review the workflow logs and data/holidays/sync-status.json. Existing last-known-good cache must remain the publication boundary."
          existing="$(gh issue list --state open --label holiday-sync-failure --limit 50 --json number,title --jq '.[] | select(.title | startswith("holiday-sync-failure:")) | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label holiday-sync-failure
          fi

      - name: Upload sync status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holiday-sync-status
          path: data/holidays/sync-status.json
          if-no-files-found: warn
