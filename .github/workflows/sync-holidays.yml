name: Sync holiday cache

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync holiday cache
        id: sync
        run: node scripts/sync-holidays.mjs

      - name: Commit updated holiday data
        if: ${{ success() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/holidays
          if ! git diff --cached --quiet; then
            git commit -m "chore(holidays): sync $(date -u +%Y) data"
            git push
          fi

      - name: Report failure to GitHub Issues
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="holiday-sync-failure: $(date -u +%Y-%m-%d)"
          body="The scheduled holiday sync failed. Review the workflow logs and the cached holiday data before publishing new calendar coverage."
          if ! gh issue list --limit 20 --search "$title" --json number --jq '.[].number' | grep -q .; then
            gh issue create --title "$title" --body "$body" --label "holiday-sync-failure"
          fi

      - name: Upload sync status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holiday-sync-status
          path: data/holidays/sync-status.json
